<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f5f5f5;">

<!-- Top Navigation -->
<div class="container py-3 d-flex justify-content-between align-items-center">

    <!-- Logo -->
    <img src="{{ url_for('static', filename='images/logo.png') }}" style="height:60px;">

    <div>
        <a href="/" class="me-3">Dashboard</a>
        <a href="/ranking">Ranking</a>
    </div>

</div>

<div class="container mt-4">

    <h1>Sign Up</h1>
    <hr>

    <!-- Form -->
    <form method="POST" action="/signup">

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" placeholder="Enter your username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" name="confirm" placeholder="Confirm your password" required>
        </div>

        <!-- DOB + Gender -->
        <div class="row mb-3">

            <div class="col-md-4">
                <label class="form-label">Date of Birth</label>
                <input type="text" class="form-control" name="dob" placeholder="YYYY-MM-DD">
            </div>

            <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select class="form-control" name="sex">
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

        </div>

        <!-- Weight + Height -->
        <div class="row mb-3">

            <div class="col-md-4">
                <label class="form-label">Weight</label>
                <div class="input-group">
                    <input type="number" class="form-control" name="weight" placeholder="e.g. 70">
                    <span class="input-group-text">kg</span>
                </div>
            </div>

            <div class="col-md-4">
                <label class="form-label">Height</label>
                <div class="input-group">
                    <input type="number" class="form-control" name="height" placeholder="e.g. 175">
                    <span class="input-group-text">cm</span>
                </div>
            </div>

        </div>

        <!-- Submit -->
        <button class="btn btn-primary">Sign Up</button>

    </form>

</div>

</body>
</html>
