<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- top bar -->
<div style="background-color: #7793ae; padding: 10px 0; text-align: center;">
  <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Exercise Planner" style="height:100px; width:auto;">
</div>

<!-- main content -->
<div class="container py-4">

    <div class="main-box">

        <h1>Create an Account</h1>
        <hr>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" name="username" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="Minimum 6 characters"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password"
                       class="form-control"
                       name="confirm"
                       placeholder="Re-enter your password"
                       required>
            </div>

            <div class="row mb-3">

                <div class="col-md-4">
                    <label class="form-label">Date of Birth</label>
                    <input type="date"
                           class="form-control"
                           name="dob">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select class="form-control" name="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-4">
                    <label class="form-label">Weight</label>
                    <div class="input-group">
                        <input type="number"
                               class="form-control"
                               name="weight"
                               placeholder="e.g. 70">
                        <span class="input-group-text">kg</span>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Height</label>
                    <div class="input-group">
                        <input type="number"
                               class="form-control"
                               name="height"
                               placeholder="e.g. 175">
                        <span class="input-group-text">cm</span>
                    </div>
                </div>

            </div>

            <button class="btn btn-primary">Sign Up</button>

        </form>

    </div>

</div>

</body>
</html>
