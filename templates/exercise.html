<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Session</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="ep-navbar">
  <a href="{{ url_for('dashboard') }}" class="ep-brand">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EP" style="height:36px; width:auto;">
  </a>
  <a href="{{ url_for('dashboard') }}" class="ep-nav-link">Dashboard</a>
  <a href="#" class="ep-nav-link">Profile</a>
  <a href="#" class="ep-nav-link">Ranking</a>
  <a href="{{ url_for('home') }}" class="ep-nav-link create-btn active">Create Exercise</a>
</nav>

<!-- Page content -->
<div class="page-content">

  <h2 class="fw-bold mb-4">Add Session</h2>

  <!-- Date and weight -->
  <div class="ep-card mb-4">
    <div class="ep-card-title">Session Details</div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Date</label>
        <input type="date" class="form-control">
      </div>
      <div class="col-md-4">
        <label class="form-label">Current Weight</label>
        <div class="input-group">
          <input type="number" class="form-control" id="weight" placeholder="Enter weight">
          <span class="input-group-text">kg</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Exercises -->
  <div class="ep-card mb-4">
    <div class="ep-card-title">Exercises in This Session</div>
    <div id="exerciseContainer"></div>
    <button class="btn-dark-rounded mt-3" onclick="addExerciseRow()">+ Add Another Exercise</button>
  </div>

  <!-- Notes -->
  <div class="ep-card mb-4">
    <div class="ep-card-title">Notes</div>
    <textarea class="form-control notes-box w-100" placeholder="Write any notes here..."></textarea>
  </div>

  <!-- Calculate calories -->
  <div class="ep-card mb-4">
    <div class="ep-card-title">Calorie Summary</div>
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <button class="btn-pink" onclick="calculateCalories()">Calculate Session Calories</button>
      <div class="alert alert-secondary mb-0 flex-grow-1" id="result">
        Total calories burnt for this session will appear here.
      </div>
    </div>
  </div>

  <button class="btn-dark-rounded">Add to Record</button>

</div><!-- /page-content -->

<script src="{{ url_for('static', filename='js/exercise.js') }}"></script>
</body>
</html>
