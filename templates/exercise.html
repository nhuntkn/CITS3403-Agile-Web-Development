<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Session</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  
  <!-- Navbar -->
  <nav class="ep-navbar">
    <a href="/dashboard" class="ep-brand">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EP">
    </a>
    <a href="/dashboard" class="ep-nav-link active">Dashboard</a>
    <a href="#" class="ep-nav-link">Ranking</a>
    <a href="#" class="ep-nav-link">History</a>
    <div class = "ep-nav-spacer"></div>
    <div class="ep-user-menu">
      <div class="ep-user-avatar">{{ username[0]|upper if username else 'J' }}</div>
      <div class="ep-user-dropdown">
        <a href = "{{ url_for('profile') }}" class = "ep-dropdown-item">Profile</a>
        <a href = "#" class = "ep-dropdown-item">Settings</a>
        <a href="{{ url_for('logout') }}" class="ep-dropdown-item">Logout</a>
      </div>
    </div>
  </nav>

  <!-- main content -->
  <div class="container py-4">
    <form class="main-box" method="POST" action="{{ url_for('exercise') }}">
      <h1>Add Session</h1>

      {% if message %}
        <div class="alert alert-success">{{ message }}</div>
      {% endif %}
      <hr>

      <!-- data and weight section -->
      <div class="row mb-4">
        <div class="col-md-4">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" name="date" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Current Weight</label>
          <div class="input-group">
            <input type="number" class="form-control" id="weight" name="weight" placeholder="Enter weight" required>
            <span class="input-group-text">kg</span>
          </div>
        </div>
      </div>

      <!-- exercise rows and notes-->
      <div class="row mb-4">
        <div class="col-md-7">
          <h4>Exercises in This Session</h4>
          <div id="exerciseContainer"></div>
          <button type="button" class="btn btn-outline-primary mt-2" onclick="addExerciseRow()">Add Another Exercise</button>
        </div>

        <div class="col-md-5">
          <h4>Notes</h4>
          <textarea class="form-control notes-box" name="notes" placeholder="Write any notes here..."></textarea>
        </div>
      </div>

      <!-- calculate calories section -->
      <div class="row align-items-center mb-4">
        <div class="col-md-auto">
          <button type="button" class="btn btn-primary" onclick="calculateCalories()">Calculate Session Calories</button>
        </div>

        <div class="col-md">
          <div class="alert alert-secondary mb-0" id="result">
            Total calories burnt for this session will appear here.
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-outline-dark">Add to Record</button>
    </form>
  </div>
  
  <script id="exercise-data" type="application/json"> {{ exercise_data | tojson }} </script>
  <script src="{{ url_for('static', filename='js/exercise.js') }}"></script>
</body>
</html>
