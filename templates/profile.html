<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f5f5f5;">

<div class="container py-3 d-flex justify-content-between align-items-center">
    <img src="{{ url_for('static', filename='images/logo.png') }}" style="height:60px;">
    <div>
        <a href="/" class="me-3">Dashboard</a>
        <a href="/ranking">Ranking</a>
    </div>
</div>

<div class="container mt-4">

    <h1>User Profile</h1>
    <hr>

    <form method="POST">

        <div class="row">

            <!-- LEFT -->
            <div class="col-md-6">
                <div class="card p-4 shadow-sm mb-4">

                    <h4 class="mb-3">Personal Information</h4>

                    <p><strong>Username:</strong> {{ user["username"] }}</p>

                    <label>Password</label>
                    <input type="text" class="form-control mb-2" name="password" value="{{ user['password'] }}">

                    <label>Date of Birth</label>
                    <input type="text" class="form-control mb-2" name="dob" value="{{ user['dob'] }}">

                    <label>Gender</label>
                    <input type="text" class="form-control mb-2" name="sex" value="{{ user['sex'] }}">

                </div>
            </div>

            <!-- RIGHT -->
            <div class="col-md-6">
                <div class="card p-4 shadow-sm mb-4">

                    <h4 class="mb-3">Fitness Statistics</h4>

                    <label>Weight (kg)</label>
                    <input type="number" class="form-control mb-2" name="weight" value="{{ user['weight'] }}">

                    <label>Height (cm)</label>
                    <input type="number" class="form-control mb-2" name="height" value="{{ user['height'] }}">

                    <p class="mt-3">
                        <strong>Total Calories Burned:</strong>
                        {% if stats %}{{ stats["kcal_burned"] }}{% else %}0{% endif %} kcal
                    </p>

                    <p>
                        <strong>Current Streak:</strong>
                        {% if stats %}{{ stats["streak"] }}{% else %}0{% endif %} days
                    </p>

                </div>
            </div>

        </div>

        <button class="btn btn-primary">Save Changes</button>

    </form>

</div>

</body>
</html>
