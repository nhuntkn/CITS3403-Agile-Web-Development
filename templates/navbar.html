<nav class = "ep-navbar">
    <a href = "{{url_for('dashboard')}}" class = "ep-brand">
        <img src = "{{url_for('static', filename = 'images/logo.png')}}" alt = "EP">
    </a>
    <div class = "ep-nav-spacer"></div>
    <a href = "{{url_for('exercise')}}" class = "ep-nav-link create-btn {{'active' if request.endpoint == 'exercise'}}">Create Exercise</a>    
    <a href = "{{url_for('dashboard')}}" class = "ep-nav-link {{'active' if request.endpoint == 'dashboard'}}">Dashboard</a>
    <a href = "{{url_for('ranking')}}" class = "ep-nav-link {{'active' if request.endpoint == 'ranking'}}">Ranking</a>
    <a href = "{{url_for('history')}}" class = "ep-nav-link {{'active' if request.endpoint == 'history'}}">History</a>
    <a href = "{{url_for('shares')}}" class = "ep-nav-link {{'active' if request.endpoint == 'shares'}}">
        Shares{% if unread_shares_count > 0 or unread_likes_count > 0 %}<span class="notif-dot"></span>{% endif %}
    </a>
    <div class = "ep-user-menu">
        <div class="ep-user-avatar">
            {% set nav_avatar_url = user_avatar_url(current_user) %}
            {% if nav_avatar_url %}
                <img src="{{ nav_avatar_url }}" alt="{{ current_user.username }}">
            {% else %}
                {{ username[0].upper() if username }}
            {% endif %}
        </div>
        <div class = "ep-user-dropdown">
            <a href = "{{url_for('account')}}" class = "ep-dropdown-item">Account</a>
            <a href = "{{url_for('logout')}}" class = "ep-dropdown-item">Logout</a>
        </div>
    </div>
</nav>
