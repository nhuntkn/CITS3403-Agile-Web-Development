<!DOCTYPE html>
<html>
<head>
    <title>Exercise Planner</title>
    <!-- Shared styles (for .btn-pink) -->
    <link rel="stylesheet" href="static/css/style.css" />
</head>

<body style="font-family: Arial; text-align: center;">

<h1>Exercise Planner</h1>

<p>
This website will help you keep track of the total calories burned through your exercises,
save your routines and see your progress everyday. JOIN NOW !!!
</p>

<div style="display: flex; justify-content: center; gap: 40px; margin-top: 40px;">

    <!-- BMI -->
    <div style="background-color: #c6d6e5; padding: 30px; width: 300px; border-radius: 12px;">
        <h2>BMI Calculator</h2>

        <p>Weight (kg)</p>
        <input type="text">

        <p>Height (cm)</p>
        <input type="text">

        <br><br>
        <button class="btn-blue">Calculate</button>

        <div style="margin-top:20px; background:#ccc; padding:10px; border-radius: 8px;">
            Result
        </div>
    </div>

    <!-- Login -->
    <div style="background-color: #e0e0e0; padding: 30px; width: 300px; border-radius: 12px;">
        <h2>Sign In</h2>

        <p>Username</p>
        <input type="text">

        <p>Password</p>
        <input type="password">

        <br><br>
        <button class="btn-blue">Sign In</button>

        <p>
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>
    </div>

</div>

</body>
</html>
