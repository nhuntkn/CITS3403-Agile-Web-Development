<!DOCTYPE html>
<html>
<head>
    <title>Exercise Planner</title>
</head>

<body style="font-family: Arial; text-align: center;">

<h1>Exercise Planner</h1>

<p>
This website will help you keep track of the total calories burned through your exercises,
save your routines and see your progress everyday. JOIN NOW !!!
</p>

<div style="display: flex; justify-content: center; gap: 40px; margin-top: 40px;">

    <!-- BMI -->
    <div style="background-color: #c6d6e5; padding: 30px; width: 300px;">
        <h2>BMI Calculator</h2>

        <p>Weight</p>
        <input type="text">

        <p>Height</p>
        <input type="text">

        <br><br>
        <button>Calculate</button>

        <div style="margin-top:20px; background:#ccc; padding:10px;">
            Result
        </div>
    </div>

    <!-- Login -->
    <div style="background-color: #d3d3d3; padding: 30px; width: 300px;">
        <h2>Sign In</h2>

        <p>Username</p>
        <input type="text">

        <p>Password</p>
        <input type="password">

        <br><br>
        <button>Sign In</button>

        <p>
            Don’t have an account?
            <a href="#">Sign Up</a>
        </p>
    </div>

</div>

</body>
</html>
